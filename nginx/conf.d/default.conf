# 🆕 限频：防登录密码爆破（每 IP 登录约 10 次/分，突发 5 次），超限返回 429
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;
limit_req_status 429;

# ══════════════════════════════════════════════════════════════════════
#  HTTPS 第一步：**只新增 443，80 端口原样不动、不加任何跳转**
#
#  ⚠️⚠️ 千万别在这里加 `return 301 https://...`。下面这些**全部钉死在
#     `http://8.141.123.141`**，一跳转就是 `https://8.141.123.141` ——
#     证书只签了域名、不含 IP，TLS 直接报错：
#       · mobile/.../PmsUpdaterPlugin.java  手机 APP 的**热更新清单地址**
#       · frontend/vite.config.h5.js        APP 内置前端的 API 地址
#       · desktop/main.js                   桌面客户端更新通道 + 在线上报
#     最要命的是热更新清单地址**烧在 APK 里**：它一挂，就没法再用热更新去修，
#     只能让每个人重装 APK —— 这是个单向门。
#
#  正确顺序：① 先只上 HTTPS（本次）→ ② 客户端改到域名并发新版 →
#            ③ 确认大家都换了新版，才打开强制跳转。
# ══════════════════════════════════════════════════════════════════════

# ── HTTP：维持现状，域名和 IP 都照常直接服务 ──
server {
    listen 80;
    server_name _;                    # 通配：域名和裸 IP 都走这里
    server_tokens off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    include /etc/nginx/conf.d/_shared-locations.inc;
}

# ── HTTPS：本次新增，只对域名生效 ──
server {
    listen 443 ssl;
    http2 on;
    server_name www.tonghuizhineng.top;
    server_tokens off;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # ⚠️ 暂不加 HSTS：它会让浏览器**强制**把本域的 http 也转成 https，
    #    等第三步客户端全部迁完再加，否则回退不了。
    include /etc/nginx/conf.d/_shared-locations.inc;
}
